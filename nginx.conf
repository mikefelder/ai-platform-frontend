server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    auth_basic "Unified AI Platform";
    auth_basic_user_file /run/secrets/frontend/htpasswd;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api/* to APIM private IP (192.168.4.4)
    # Using IP directly because container DNS can't resolve the private DNS zone
    location ^~ /api/ {
        if ($http_sec_fetch_site = cross-site) {
            return 403;
        }
        if ($http_content_type !~* "^application/json(;|$)") {
            return 415;
        }

        limit_except POST {
            deny all;
        }

        proxy_pass https://192.168.4.4/;
        proxy_ssl_server_name on;
        proxy_ssl_name ai-alz-apim-i40e.azure-api.net;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host ai-alz-apim-i40e.azure-api.net;
        proxy_set_header Ocp-Apim-Subscription-Key "${APIM_SUBSCRIPTION_KEY}";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
